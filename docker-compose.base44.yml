services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5000"
    environment:
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
    command: ["sh", "-ec", "pip install --quiet -r requirements.txt && exec python -m flask run --host=0.0.0.0 --port=5000 --reload"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
